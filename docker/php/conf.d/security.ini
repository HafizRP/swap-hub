; Security settings for PHP
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
allow_url_fopen = On
allow_url_include = Off

; Disable dangerous functions (Keep some enabled for Laravel/Artisan)
disable_functions = passthru,shell_exec,system,curl_multi_exec,parse_ini_file,show_source

# Limits
memory_limit = 256M
post_max_size = 50M
upload_max_filesize = 50M
max_execution_time = 60
max_input_time = 60
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
