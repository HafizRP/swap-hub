services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    image: swap-hub-app-${APP_ENV:-development}:latest
    container_name: swap-hub-app-${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5541}:80"
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
      - storage-data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      APP_NAME: "${APP_NAME:-Swap Hub}"
      APP_ENV: ${APP_ENV:-development}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:5541}
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEEDERS: "${RUN_SEEDERS:-false}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-swap_hub}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REVERB_APP_ID: ${REVERB_APP_ID:-554101}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-swaphubreverbkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-swaphubreverbsecret}
      REVERB_HOST: ${REVERB_HOST:-127.0.0.1}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}

  db:
    image: mariadb:10.11
    container_name: swap-hub-db-${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-swap_hub}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: swap-hub-redis-${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  storage-data:
    driver: local
    name: swap-hub-storage-${APP_ENV:-development}
  db-data:
    driver: local
    name: swap-hub-db-${APP_ENV:-development}

