services:
  app:
    image: swap-hub-app-${APP_ENV}:latest
    container_name: swap-hub-app-${APP_ENV}
    restart: unless-stopped
    ports:
      - "5541:80"
    working_dir: /var/www
    volumes:
      - storage-data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      APP_NAME: "Swap Hub"
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis

  db:
    image: mariadb:10.11
    container_name: swap-hub-db-${APP_ENV}
    restart: unless-stopped
    ports:
      - "${DB_PORT}:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./${APP_ENV}/dbdata:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    container_name: swap-hub-redis-${APP_ENV}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  storage-data:
    driver: local
    name: swap-hub-storage-${APP_ENV}
